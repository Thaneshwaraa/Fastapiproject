<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garage · Car Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface-2: #f0f2f7;
      --border: #e3e6ee;
      --text: #161a23;
      --muted: #6b7385;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef0ff;
      --danger: #e11d48;
      --danger-soft: #ffe8ee;
      --success: #059669;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .06);
      --shadow-lg: 0 20px 60px rgba(16, 24, 40, .25);
      --radius: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1017;
        --surface: #161a24;
        --surface-2: #1e2330;
        --border: #2a3040;
        --text: #eef0f5;
        --muted: #8d95a8;
        --accent: #7c74ff;
        --accent-hover: #918aff;
        --accent-soft: #24234a;
        --danger: #fb6185;
        --danger-soft: #3a1a24;
        --success: #34d399;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
        --shadow-lg: 0 20px 60px rgba(0, 0, 0, .6);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; box-shadow: 0 6px 18px rgba(99, 102, 241, .35);
    }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; border-radius: 10px;
      padding: 10px 16px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background .15s, transform .05s, border-color .15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn svg { width: 16px; height: 16px; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .user-badge { color: var(--muted); font-size: 13px; font-weight: 600; }
    .form-error { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 12px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .stat-value { font-size: 26px; font-weight: 800; margin-top: 6px; letter-spacing: -.02em; }
    .stat-sub { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Toolbar */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .search { flex: 1 1 260px; position: relative; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
    .field {
      width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search .field { padding-left: 38px; }
    select.field { width: auto; cursor: pointer; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .car {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px;
      box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; transition: transform .15s, box-shadow .15s;
      animation: pop .25s ease-out;
    }
    .car:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(16, 24, 40, .06), 0 12px 28px rgba(16, 24, 40, .1); }
    @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
    .car-top { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
      font-weight: 800; font-size: 18px; color: #fff; flex-shrink: 0;
    }
    .car-name { min-width: 0; }
    .car-make { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .car-model { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .tag.year { background: var(--accent-soft); color: var(--accent); }
    .car-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
    .car-actions .btn { flex: 1; justify-content: center; padding: 8px 10px; font-size: 13px; }
    .btn-soft-danger { background: transparent; border-color: var(--border); color: var(--danger); }
    .btn-soft-danger:hover { background: var(--danger-soft); border-color: transparent; }
    .confirm { font-size: 13px; color: var(--danger); font-weight: 600; text-align: center; }

    .empty {
      grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted);
      border: 2px dashed var(--border); border-radius: var(--radius);
    }
    .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(10, 12, 20, .55); backdrop-filter: blur(4px);
      display: grid; place-items: center; padding: 20px; z-index: 50; animation: fade .15s;
    }
    @keyframes fade { from { opacity: 0; } }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-lg);
      width: 100%; max-width: 440px; padding: 24px; animation: rise .2s ease-out;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.98); } }
    .modal h2 { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
    .modal .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field:disabled { opacity: .6; cursor: not-allowed; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

    /* Toasts */
    .toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 60; }
    .toast {
      display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border);
      border-left: 4px solid var(--success); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow-lg);
      font-size: 14px; font-weight: 500; animation: slide .2s ease-out; max-width: 340px;
    }
    .toast.error { border-left-color: var(--danger); }
    @keyframes slide { from { opacity: 0; transform: translateX(20px); } }

    .skeleton { height: 170px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border: 1px solid var(--border); }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
      .toasts { left: 16px; right: 16px; }
      .toast { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17a2 2 0 1 0 4 0M5 17a2 2 0 1 1 4 0m6 0a2 2 0 1 0 4 0m-4 0a2 2 0 1 1 4 0M3 17v-4l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5v4"/></svg>
        </div>
        <div>
          <h1>Garage</h1>
          <p>Manage your car collection</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="user-badge" id="user-badge" hidden></span>
        <button class="btn btn-ghost" id="auth-btn">Log in</button>
        <button class="btn btn-primary" id="add-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add car
        </button>
      </div>
    </header>

    <section class="stats">
      <div class="stat"><div class="stat-label">Total cars</div><div class="stat-value" id="stat-total">–</div><div class="stat-sub">in the garage</div></div>
      <div class="stat"><div class="stat-label">Brands</div><div class="stat-value" id="stat-brands">–</div><div class="stat-sub" id="stat-brands-sub">&nbsp;</div></div>
      <div class="stat"><div class="stat-label">Newest</div><div class="stat-value" id="stat-newest">–</div><div class="stat-sub" id="stat-newest-sub">&nbsp;</div></div>
      <div class="stat"><div class="stat-label">Average year</div><div class="stat-value" id="stat-avg">–</div><div class="stat-sub">across all cars</div></div>
    </section>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="field" id="search" placeholder="Search by make, model or year…" autocomplete="off">
      </div>
      <select class="field" id="sort" aria-label="Sort cars">
        <option value="id">Sort: ID</option>
        <option value="newest">Sort: Newest first</option>
        <option value="oldest">Sort: Oldest first</option>
        <option value="make">Sort: Make A–Z</option>
      </select>
    </div>

    <section class="grid" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Add a car</h2>
      <p class="sub" id="modal-sub">Fill in the details below.</p>
      <form id="car-form">
        <div class="form-grid">
          <div><label for="f-id">ID</label><input class="field" id="f-id" type="number" min="1" required></div>
          <div><label for="f-year">Year</label><input class="field" id="f-year" type="number" min="1886" max="2100" required></div>
          <div class="full"><label for="f-make">Make</label><input class="field" id="f-make" placeholder="e.g. Toyota" required></div>
          <div class="full"><label for="f-model">Model</label><input class="field" id="f-model" placeholder="e.g. Corolla" required></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Add car</button>
        </div>
      </form>
    </div>
  </div>

  <div class="overlay" id="login-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <h2 id="login-title">Log in</h2>
      <p class="sub">Log in to add, edit or delete cars.</p>
      <form id="login-form">
        <div class="form-grid">
          <div class="full"><label for="l-user">Username</label><input class="field" id="l-user" autocomplete="username" required></div>
          <div class="full"><label for="l-pass">Password</label><input class="field" id="l-pass" type="password" autocomplete="current-password" required></div>
        </div>
        <div class="form-error" id="login-error" hidden></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="login-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Log in</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    const $ = id => document.getElementById(id);
    const grid = $("grid"), overlay = $("overlay"), form = $("car-form");
    const PALETTE = ["#6366f1", "#ec4899", "#f59e0b", "#10b981", "#06b6d4", "#8b5cf6", "#ef4444", "#14b8a6"];
    let cars = [];
    let editingId = null;
    let confirmingId = null;
    let afterLogin = null;
    const loginOverlay = $("login-overlay"), loginForm = $("login-form");

    function getToken() {
      try { return localStorage.getItem("token"); } catch { return null; }
    }

    function setSession(token, username) {
      try {
        if (token) {
          localStorage.setItem("token", token);
          localStorage.setItem("username", username);
        } else {
          localStorage.removeItem("token");
          localStorage.removeItem("username");
        }
      } catch {}
      renderAuth(token ? username : null);
    }

    function renderAuth(username) {
      $("user-badge").hidden = !username;
      $("user-badge").textContent = username ? `Signed in as ${username}` : "";
      $("auth-btn").textContent = username ? "Log out" : "Log in";
    }

    function openLogin(then = null) {
      afterLogin = then;
      loginForm.reset();
      $("login-error").hidden = true;
      loginOverlay.hidden = false;
      setTimeout(() => $("l-user").focus(), 50);
    }

    function closeLogin() { loginOverlay.hidden = true; afterLogin = null; }

    // Runs an action that needs a login, asking for one first if needed
    function requireLogin(action) {
      if (getToken()) action();
      else openLogin(action);
    }

    function colorFor(text) {
      let h = 0;
      for (const ch of text.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return PALETTE[h % PALETTE.length];
    }

    function toast(text, isError = false) {
      const el = document.createElement("div");
      el.className = "toast" + (isError ? " error" : "");
      el.textContent = text;
      $("toasts").appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    async function api(url, options = {}) {
      const headers = { "Content-Type": "application/json" };
      const token = getToken();
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(url, { headers, ...options });
      const data = await res.json();
      if (res.status === 401 && url !== "/login") {
        setSession(null);
        openLogin();
      }
      if (!res.ok) throw new Error(Array.isArray(data.detail) ? data.detail[0].msg : data.detail || "Request failed");
      return data;
    }

    async function loadCars() {
      try {
        cars = (await api("/cars")).cars;
        render();
      } catch (e) {
        grid.innerHTML = `<div class="empty"><strong>Couldn't load cars</strong>${e.message}</div>`;
      }
    }

    function renderStats() {
      $("stat-total").textContent = cars.length;
      const brands = [...new Set(cars.map(c => c.make))];
      $("stat-brands").textContent = brands.length;
      $("stat-brands-sub").textContent = brands.slice(0, 3).join(", ") + (brands.length > 3 ? "…" : "") || " ";
      if (cars.length) {
        const newest = cars.reduce((a, b) => (b.year > a.year ? b : a));
        $("stat-newest").textContent = newest.year;
        $("stat-newest-sub").textContent = `${newest.make} ${newest.model}`;
        $("stat-avg").textContent = Math.round(cars.reduce((s, c) => s + c.year, 0) / cars.length);
      } else {
        ["stat-newest", "stat-avg"].forEach(id => ($(id).textContent = "–"));
        $("stat-newest-sub").textContent = " ";
      }
    }

    function visibleCars() {
      const q = $("search").value.trim().toLowerCase();
      const list = cars.filter(c => `${c.make} ${c.model} ${c.year}`.toLowerCase().includes(q));
      const sorters = {
        id: (a, b) => a.id - b.id,
        newest: (a, b) => b.year - a.year,
        oldest: (a, b) => a.year - b.year,
        make: (a, b) => a.make.localeCompare(b.make) || a.model.localeCompare(b.model),
      };
      return list.sort(sorters[$("sort").value]);
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render() {
      renderStats();
      const list = visibleCars();
      grid.innerHTML = "";

      if (!list.length) {
        const empty = el("div", "empty");
        empty.append(
          el("strong", "", cars.length ? "No matches" : "Your garage is empty"),
          cars.length ? "Try a different search." : "Click “Add car” to add your first one."
        );
        grid.appendChild(empty);
        return;
      }

      for (const car of list) {
        const card = el("article", "car");

        const top = el("div", "car-top");
        const avatar = el("div", "avatar", car.make.charAt(0).toUpperCase());
        avatar.style.background = colorFor(car.make);
        const name = el("div", "car-name");
        name.append(el("div", "car-make", car.make), el("div", "car-model", car.model));
        top.append(avatar, name);

        const tags = el("div", "tags");
        tags.append(el("span", "tag year", car.year), el("span", "tag", `ID #${car.id}`));

        const actions = el("div", "car-actions");
        if (confirmingId === car.id) {
          const yes = el("button", "btn btn-danger", "Delete");
          yes.onclick = () => deleteCar(car.id);
          const no = el("button", "btn btn-ghost", "Keep");
          no.onclick = () => { confirmingId = null; render(); };
          const wrap = el("div", "");
          wrap.style.width = "100%";
          const row = el("div", "");
          row.style.cssText = "display:flex;gap:8px;margin-top:8px";
          row.append(no, yes);
          wrap.append(el("div", "confirm", "Delete this car?"), row);
          actions.appendChild(wrap);
        } else {
          const edit = el("button", "btn btn-ghost", "Edit");
          edit.onclick = () => requireLogin(() => openModal(car));
          const del = el("button", "btn btn-soft-danger", "Delete");
          del.onclick = () => requireLogin(() => { confirmingId = car.id; render(); });
          actions.append(edit, del);
        }

        card.append(top, tags, actions);
        grid.appendChild(card);
      }
    }

    function openModal(car = null) {
      editingId = car ? car.id : null;
      form.reset();
      $("modal-title").textContent = car ? `Edit ${car.make} ${car.model}` : "Add a car";
      $("modal-sub").textContent = car ? "Update the details and save." : "Fill in the details below.";
      $("save-btn").textContent = car ? "Save changes" : "Add car";
      $("f-id").disabled = !!car;
      if (car) {
        $("f-id").value = car.id;
        $("f-make").value = car.make;
        $("f-model").value = car.model;
        $("f-year").value = car.year;
      } else {
        $("f-id").value = cars.length ? Math.max(...cars.map(c => c.id)) + 1 : 1;
        $("f-year").value = new Date().getFullYear();
      }
      overlay.hidden = false;
      setTimeout(() => $("f-make").focus(), 50);
    }

    function closeModal() { overlay.hidden = true; }

    async function deleteCar(id) {
      try {
        await api(`/cars/${id}`, { method: "DELETE" });
        confirmingId = null;
        toast("Car deleted");
        loadCars();
      } catch (e) {
        toast(e.message, true);
      }
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const car = {
        id: Number($("f-id").value),
        make: $("f-make").value.trim(),
        model: $("f-model").value.trim(),
        year: Number($("f-year").value),
      };
      try {
        if (editingId === null) {
          await api("/cars", { method: "POST", body: JSON.stringify(car) });
          toast(`${car.make} ${car.model} added`);
        } else {
          await api(`/cars/${editingId}`, { method: "PUT", body: JSON.stringify(car) });
          toast(`${car.make} ${car.model} updated`);
        }
        closeModal();
        loadCars();
      } catch (err) {
        toast(err.message, true);
      }
    });

    loginForm.addEventListener("submit", async e => {
      e.preventDefault();
      const username = $("l-user").value.trim();
      try {
        const data = await api("/login", {
          method: "POST",
          body: JSON.stringify({ username, password: $("l-pass").value }),
        });
        setSession(data.access_token, data.username);
        const next = afterLogin;
        closeLogin();
        toast(`Welcome, ${data.username}`);
        if (next) next();
      } catch (err) {
        $("login-error").textContent = err.message;
        $("login-error").hidden = false;
      }
    });

    $("auth-btn").onclick = () => {
      if (getToken()) {
        setSession(null);
        toast("Logged out");
      } else {
        openLogin();
      }
    };

    $("add-btn").onclick = () => requireLogin(() => openModal());
    $("cancel-btn").onclick = closeModal;
    $("login-cancel").onclick = closeLogin;
    overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
    loginOverlay.addEventListener("click", e => { if (e.target === loginOverlay) closeLogin(); });
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (!loginOverlay.hidden) closeLogin();
      else if (!overlay.hidden) closeModal();
    });
    $("search").addEventListener("input", render);
    $("sort").addEventListener("change", render);

    // Check a saved token is still valid before showing the user as signed in
    if (getToken()) {
      api("/me").then(data => renderAuth(data.username)).catch(() => {});
    }
    loadCars();
  </script>
</body>
</html>
